# Single Compose recipe for auth-service.
#
# Two ways to run it:
#   1. Prebuilt image (recommended) — `docker compose pull && docker compose up -d`
#      Pulls the image published by the GitHub workflow. Default tag is `nightly`
#      (tracks the develop branch); set AUTH_IMAGE=...:latest for a stable release.
#   2. Build from source — `docker compose up -d --build`
#
# Credentials and secrets come from `.env` (copy `.env.example` to `.env`).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Exposed on the host so `pnpm dev` can connect to the containerised DB.
    # Remove or firewall this mapping in production deployments.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-auth}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    # Prebuilt image from GHCR. `docker compose pull` fetches it; `--build`
    # builds the same tag locally from the Dockerfile instead.
    image: ${AUTH_IMAGE:-ghcr.io/circle-rd/auth-service:nightly}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      # The published image is a production build without devDependencies;
      # always run it in production mode (hot-reload dev uses `pnpm dev` on the host).
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-}

      # Docker-internal database hostname.
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/${POSTGRES_DB:-auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}

      # Bootstrap superadmin (created on first boot if absent).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Networking / sessions.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}

      # Auth flows. Email verification defaults to false here so the stack
      # boots without SMTP; set REQUIRE_EMAIL_VERIFICATION=true and configure
      # SMTP_HOST in production.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      MAGIC_LINK_ENABLED: ${MAGIC_LINK_ENABLED:-false}
      EMAIL_OTP_ENABLED: ${EMAIL_OTP_ENABLED:-false}

      # Branding (displayed in UI + used as TOTP issuer).
      APP_NAME: ${APP_NAME:-CIRCLE Auth}
      APP_LOGO_URL: ${APP_LOGO_URL:-https://avatars.githubusercontent.com/u/266095592?v=4}

      # SMTP (optional). Start the local catcher with `--profile mail` and set
      # SMTP_HOST=mailpit SMTP_PORT=1025 to inspect outbound mail at :8025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-auth-service <no-reply@localhost>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # Phase 5b optional features (all off by default).
      HAVEIBEENPWNED_ENABLED: ${HAVEIBEENPWNED_ENABLED:-false}
      LAST_LOGIN_METHOD_ENABLED: ${LAST_LOGIN_METHOD_ENABLED:-false}
      DEVICE_AUTHORIZATION_ENABLED: ${DEVICE_AUTHORIZATION_ENABLED:-false}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_ENDPOINTS: ${CAPTCHA_ENDPOINTS:-}
      REDIS_URL: ${REDIS_URL:-}

      # Social providers (optional).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}

      # Stripe (optional).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PORT:-3001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional local mail catcher. Hidden behind a profile so the default stack
  # is unchanged: `docker compose --profile mail up -d`. SMTP on :1025, web UI
  # on http://localhost:8025. Set SMTP_HOST=mailpit SMTP_PORT=1025 to use it.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Optional Redis for shared rate-limit state. Start with `--profile redis`
  # and set REDIS_URL=redis://redis:6379 on the auth-service.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # Optional LiteLLM gateway (LLMs + MCP), authenticated with auth-service
  # access tokens. Start with `--profile llm` after `pnpm llm:setup` has
  # generated LITELLM_MASTER_KEY / LITELLM_SALT_KEY and registered the gateway
  # as a protected resource. See docs: getting-started / LiteLLM gateway.
  litellm-db-init:
    image: postgres:17-alpine
    profiles: ["llm"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-auth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-auth}
    # Idempotent: the LiteLLM database is created next to the auth one even
    # when the postgres volume already exists (initdb.d only runs on first boot).
    command:
      - sh
      - -c
      - >-
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1
        || psql -d postgres -c "CREATE DATABASE litellm"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  litellm:
    # Pinned: custom_auth relies on LiteLLM internals, re-run `pnpm llm:smoke`
    # before bumping the tag.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.104.2}
    profiles: ["llm"]
    command: ["--config", "/app/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Encrypts provider credentials stored in the database: never change it
      # once models have been added.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/litellm
      # Token validation (litellm/custom_auth.py, which refuses to start when a
      # value is empty; `:?` is avoided because compose also interpolates
      # services of inactive profiles). The JWKS is fetched over the Docker
      # network; iss/aud must match what auth-service puts in the token.
      JWT_PUBLIC_KEY_URL: http://auth-service:${PORT:-3001}/api/auth/jwks
      JWT_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3001}
      JWT_AUDIENCE: ${LITELLM_PUBLIC_URL:-}
    volumes:
      - ./litellm:/app/litellm:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
