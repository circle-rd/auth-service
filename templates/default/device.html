<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device authorization</title>
  <meta name="description" content="Approve a device sign-in request." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Device authorization" />
  <meta property="og:description" content="Approve a device sign-in request." />
  <meta property="og:image" content="<%= it.AUTH_URL %>/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Device authorization" />
  <meta name="twitter:description" content="Approve a device sign-in request." />
  <meta name="twitter:image" content="<%= it.AUTH_URL %>/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:             #f4f4f5;
      --surface:        rgba(255,255,255,0.9);
      --surface-inner:  #f4f4f5;
      --border:         rgba(212,212,216,0.7);
      --border-focus:   #2563eb;
      --text:           #09090b;
      --text-muted:     #71717a;
      --text-subtle:    #a1a1aa;
      --primary:        #2563eb;
      --primary-hover:  #3b82f6;
      --primary-glow:   rgba(37,99,235,0.15);
      --danger:         #ef4444;
      --danger-bg:      rgba(239,68,68,0.08);
      --danger-border:  rgba(239,68,68,0.25);
      --success:        #16a34a;
      --radius-sm: 4px; --radius: 7px; --radius-lg: 9px; --radius-xl: 12px;
      --shadow-lg: 0 8px 24px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:             #09090b;
        --surface:        rgba(24,24,27,0.6);
        --surface-inner:  rgba(39,39,42,0.6);
        --border:         rgba(63,63,70,0.4);
        --border-focus:   #3b82f6;
        --text:           #fafafa;
        --text-muted:     #a1a1aa;
        --text-subtle:    #52525b;
        --primary:        #2563eb;
        --primary-hover:  #3b82f6;
        --primary-glow:   rgba(59,130,246,0.12);
        --danger:         #f87171;
        --danger-bg:      rgba(239,68,68,0.1);
        --danger-border:  rgba(239,68,68,0.3);
        --success:        #4ade80;
        --shadow-lg: 0 8px 32px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .auth-container { width: 100%; max-width: 22rem; display: flex; flex-direction: column; align-items: center; }
    .auth-header { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; text-align: center; }
    .auth-icon {
      width: 3rem; height: 3rem; border-radius: var(--radius-xl);
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(37,99,235,0.35); margin-bottom: 0.25rem;
    }
    .auth-icon svg { width: 1.375rem; height: 1.375rem; }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 1.5rem; width: 100%;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block; font-size: 0.8125rem; font-weight: 500;
      color: var(--text-muted); margin-bottom: 0.375rem;
    }
    input[type="text"] {
      width: 100%; padding: 0.5625rem 0.75rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 1.0625rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.2em; text-transform: uppercase; text-align: center;
      color: var(--text); background: var(--surface-inner);
      outline: none; transition: border-color .15s, box-shadow .15s; line-height: 1.5;
    }
    input::placeholder { color: var(--text-subtle); letter-spacing: 0.2em; }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--primary-glow); }
    .details {
      margin-top: 0.875rem; padding: 0.625rem 0.75rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface-inner);
      font-size: 0.8125rem; color: var(--text-muted); line-height: 1.5;
      word-break: break-word;
    }
    .details strong { color: var(--text); font-weight: 600; }
    .error-box {
      display: none; margin-bottom: 1rem; padding: 0.625rem 0.75rem;
      font-size: 0.8125rem; line-height: 1.5;
      color: var(--danger); background: var(--danger-bg);
      border: 1px solid var(--danger-border); border-radius: var(--radius);
    }
    .actions { display: flex; gap: 0.625rem; margin-top: 1.25rem; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.5625rem 1rem; border-radius: var(--radius);
      font-size: 0.9375rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s, box-shadow .15s, opacity .15s, border-color .15s;
      border: 1px solid transparent; line-height: 1.5; margin: 0;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-subtle); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      display: none; margin-top: 1rem; font-size: 0.8125rem; line-height: 1.5; text-align: center;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .footnote { margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-subtle); text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="13" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" />
        </svg>
      </div>
      <h1>Device authorization</h1>
      <p class="subtitle">Enter the code shown on your device to grant it access.</p>
      <% if (it.SESSION_EMAIL) { %><p class="subtitle">Signed in as <strong><%= it.SESSION_EMAIL %></strong></p><% } %>
    </div>

    <div class="card">
      <div class="error-box" id="error-box" role="alert"></div>

      <form id="device-form" novalidate>
        <div class="form-group">
          <label for="user-code">Device code</label>
          <input
            id="user-code"
            name="user_code"
            type="text"
            inputmode="text"
            autocomplete="one-time-code"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="XXXXXXXX"
          />
        </div>

        <div class="details" id="details" hidden></div>

        <div class="actions">
          <button type="button" class="btn btn-ghost" id="deny-btn" disabled>Deny</button>
          <button type="submit" class="btn btn-primary" id="approve-btn" disabled>Approve</button>
        </div>
      </form>

      <p class="status" id="status" role="status"></p>
    </div>

    <p class="footnote">Only approve devices you recognize. The code expires shortly after it is displayed.</p>
  </div>

  <script type="module">
    const AUTH_URL = '<%= it.AUTH_URL %>';
    const form = document.getElementById('device-form');
    const input = document.getElementById('user-code');
    const approveBtn = document.getElementById('approve-btn');
    const denyBtn = document.getElementById('deny-btn');
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const errorBox = document.getElementById('error-box');
    let currentCode = '';

    const params = new URLSearchParams(window.location.search);
    if (params.get('user_code')) {
      input.value = params.get('user_code').trim().toUpperCase();
      // Prefill does not fire an `input` event, so trigger the lookup
      // explicitly for the verification_uri_complete path.
      lookup();
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = message ? 'block' : 'none';
    }

    function showStatus(type, message) {
      statusEl.className = 'status ' + type;
      statusEl.textContent = message;
      statusEl.style.display = message ? 'block' : 'none';
    }

    function setEnabled(enabled) {
      approveBtn.disabled = !enabled;
      denyBtn.disabled = !enabled;
    }

    function reset() {
      currentCode = '';
      detailsEl.hidden = true;
      detailsEl.textContent = '';
      setEnabled(false);
    }

    async function lookup() {
      const code = input.value.trim().toUpperCase();
      if (!code) return;
      showError('');
      showStatus('', '');
      reset();
      try {
        const res = await fetch(`${AUTH_URL}/api/auth/device?user_code=${encodeURIComponent(code)}`, {
          credentials: 'include',
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data?.error_description ?? 'Invalid or expired code.');
          return;
        }
        currentCode = code;
        setEnabled(true);
        detailsEl.replaceChildren();
        const app = document.createElement('div');
        app.append('Application: ');
        const appName = document.createElement('strong');
        appName.textContent = data.client_id ?? 'unknown';
        app.append(appName);
        detailsEl.append(app);
        if (data.scope) {
          const scopes = document.createElement('div');
          scopes.textContent = `Scopes: ${data.scope}`;
          detailsEl.append(scopes);
        }
        detailsEl.hidden = false;
      } catch {
        showError('A network error occurred. Please try again.');
      }
    }

    input.addEventListener('input', () => {
      showError('');
      showStatus('', '');
      reset();
      if (input.value.trim().length >= 4) lookup();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      decide('approve');
    });

    denyBtn.addEventListener('click', () => decide('deny'));

    async function decide(action) {
      if (!currentCode) return;
      setEnabled(false);
      showError('');
      try {
        const res = await fetch(`${AUTH_URL}/api/auth/device/${action}`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', 'Origin': window.location.origin },
          body: JSON.stringify({ userCode: currentCode }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data?.error_description ?? 'Request failed. Please try again.');
          setEnabled(true);
          return;
        }
        showStatus('success', action === 'approve' ? 'Device approved. You can return to your device.' : 'Device denied.');
        input.value = '';
        reset();
      } catch {
        showError('A network error occurred. Please try again.');
        setEnabled(true);
      }
    }
  </script>
</body>
</html>
