# Single Compose recipe for auth-service.
#
# Two ways to run it:
#   1. Prebuilt image (recommended) — `docker compose pull && docker compose up -d`
#      Pulls the image published by the GitHub workflow. Default tag is `nightly`
#      (tracks the develop branch); set AUTH_IMAGE=...:latest for a stable release.
#   2. Build from source — `docker compose up -d --build`
#
# Credentials and secrets come from `.env` (copy `.env.example` to `.env`).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Exposed on the host so `pnpm dev` can connect to the containerised DB.
    # Remove or firewall this mapping in production deployments.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-auth}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    # Prebuilt image from GHCR. `docker compose pull` fetches it; `--build`
    # builds the same tag locally from the Dockerfile instead.
    image: ${AUTH_IMAGE:-ghcr.io/circle-rd/auth-service:nightly}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      # The published image is a production build without devDependencies;
      # always run it in production mode (hot-reload dev uses `pnpm dev` on the host).
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-}

      # Docker-internal database hostname.
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/${POSTGRES_DB:-auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_RATE_LIMIT_ENABLED: ${BETTER_AUTH_RATE_LIMIT_ENABLED:-true}

      # Bootstrap superadmin (created on first boot if absent).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Networking / sessions.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Forwarded only so the config rejects a stale pre-migration setting.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}

      # Auth flows. Email verification defaults to false here so the stack
      # boots without SMTP; set REQUIRE_EMAIL_VERIFICATION=true and configure
      # SMTP_HOST in production.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      MAGIC_LINK_ENABLED: ${MAGIC_LINK_ENABLED:-false}
      EMAIL_OTP_ENABLED: ${EMAIL_OTP_ENABLED:-false}

      # Branding (displayed in UI + used as TOTP issuer).
      APP_NAME: ${APP_NAME:-CIRCLE Auth}
      APP_LOGO_URL: ${APP_LOGO_URL:-}
      APP_LOGO_DARK_URL: ${APP_LOGO_DARK_URL:-}
      # Public landing page at `/` (the admin sign-in stays at `/auth`).
      SHOWCASE: ${SHOWCASE:-false}

      # SMTP (optional). Start the local catcher with `--profile mail` and set
      # SMTP_HOST=mailpit SMTP_PORT=1025 to inspect outbound mail at :8025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-auth-service <no-reply@localhost>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # Phase 5b optional features (off by default, except the last-login-method
      # cookie, which is on like in the application's own defaults).
      HAVEIBEENPWNED_ENABLED: ${HAVEIBEENPWNED_ENABLED:-false}
      LAST_LOGIN_METHOD_ENABLED: ${LAST_LOGIN_METHOD_ENABLED:-true}
      DEVICE_AUTHORIZATION_ENABLED: ${DEVICE_AUTHORIZATION_ENABLED:-false}
      OAUTH_DEVICE_GRANT_ENABLED: ${OAUTH_DEVICE_GRANT_ENABLED:-false}
      REVERSE_AGENT_CLIENT_ID: ${REVERSE_AGENT_CLIENT_ID:-reverse-agent}
      REVERSE_AGENT_RESOURCE: ${REVERSE_AGENT_RESOURCE:-}
      REVERSE_AGENT_RESOURCE_NAME: ${REVERSE_AGENT_RESOURCE_NAME:-reverse-relay}
      REVERSE_AGENT_ACCESS_TOKEN_TTL_SECONDS: ${REVERSE_AGENT_ACCESS_TOKEN_TTL_SECONDS:-900}
      MFA_BACKFILL_ENABLED: ${MFA_BACKFILL_ENABLED:-false}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_ENDPOINTS: ${CAPTCHA_ENDPOINTS:-}
      REDIS_URL: ${REDIS_URL:-}

      COMPAT_PROFILE: ${COMPAT_PROFILE:-default}
      TOKEN_ENDPOINT_AUTH_METHOD: ${TOKEN_ENDPOINT_AUTH_METHOD:-}
      JWT_PRIMARY_ALG: ${JWT_PRIMARY_ALG:-}
      DEFAULT_AUDIENCE: ${DEFAULT_AUDIENCE:-}
      AUDIENCE_PARAM: ${AUDIENCE_PARAM:-}
      CLAIM_MAPPINGS: ${CLAIM_MAPPINGS:-}
      COMPAT_ALIASES: ${COMPAT_ALIASES:-}

      # Per-application login pages and emails; set to /templates to use ./templates.
      TEMPLATES_DIR: ${TEMPLATES_DIR:-}

      # Social providers (optional).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}

      # Stripe (optional).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Wallet: starting rate and margin for the price of LLM usage (a superadmin
      # edits them in the admin interface afterwards) and bounds of an online
      # top-up. With no rate set anywhere the usage endpoint answers 503.
      WALLET_USD_TO_EUR_RATE: ${WALLET_USD_TO_EUR_RATE:-}
      WALLET_MARGIN_PERCENT: ${WALLET_MARGIN_PERCENT:-0}
      WALLET_TOPUP_MIN_EUR: ${WALLET_TOPUP_MIN_EUR:-5}
      WALLET_TOPUP_MAX_EUR: ${WALLET_TOPUP_MAX_EUR:-500}
      WALLET_AUTO_TOPUP_TERMS_URL: ${WALLET_AUTO_TOPUP_TERMS_URL:-https://circle-cyber.com/conditions-generales#recharge-automatique}

      # LiteLLM gateway (profile "llm"): auth-service mirrors the gateway
      # inventory with the read-only key litellm-provision delivers, then resolves
      # entitlements from the generic resource grants.
      LITELLM_URL: http://litellm:4000
      LITELLM_INVENTORY_KEY_FILE: /run/litellm-provisioner/inventory-key
      RESOURCE_SHARING_ENABLED: ${RESOURCE_SHARING_ENABLED:-false}
      RESOURCE_SCHEMES_ENABLED: ${RESOURCE_SCHEMES_ENABLED:-}
      # SSH profile: envelope key for resource identity keys, and the public
      # host/port used to build the owner validation command. The host stays
      # unset unless the operator supplies the public gateway hostname.
      SSH_GATEWAY_ENVELOPE_KEY: ${SSH_GATEWAY_ENVELOPE_KEY:-}
      SSH_GATEWAY_VALIDATION_HOST: ${SSH_GATEWAY_VALIDATION_HOST:-}
      SSH_GATEWAY_EGRESS_IP: ${SSH_GATEWAY_EGRESS_IP:-}
      SSH_GATEWAY_PORT: ${SSH_GATEWAY_PORT:-2222}
    networks:
      - default
      - ssh_gateway_net
    volumes:
      - litellm_provisioner:/run/litellm-provisioner:ro
      - ./templates:/templates:ro
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PORT:-3001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional local mail catcher. Hidden behind a profile so the default stack
  # is unchanged: `docker compose --profile mail up -d`. SMTP on :1025, web UI
  # on http://localhost:8025. Set SMTP_HOST=mailpit SMTP_PORT=1025 to use it.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Optional Redis for shared rate-limit state. Start with `--profile redis`
  # and set REDIS_URL=redis://redis:6379 on the auth-service.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # Optional LiteLLM gateway (LLMs + MCP), authenticated with auth-service
  # access tokens. Start with `--profile llm` (or COMPOSE_PROFILES=llm): the
  # one-shot `litellm-setup` service provisions everything, so the only setting
  # to provide is LITELLM_PUBLIC_URL. See docs: LiteLLM gateway.

  # Provisions the gateway, then exits. It copies the config shipped in the
  # auth-service image into a shared volume (so the config follows the version of
  # auth-service whose tokens it validates), generates the master and salt keys
  # once (values already in the environment are used instead), registers the
  # "litellm" application and the "litellm-wallet" machine client in
  # auth-service, and stores the secrets next to the config. Idempotent: it runs
  # at every start and never regenerates a stored secret. Needs the administrator
  # account to sign in without MFA, except once a run has completed: it then
  # skips (exit 0) instead of blocking the gateway when MFA was enabled since.
  litellm-setup:
    image: ${AUTH_IMAGE:-ghcr.io/circle-rd/auth-service:nightly}
    profiles: ["llm"]
    user: root
    entrypoint:
      - sh
      - -c
      - cp -f /app/litellm/*.py /app/litellm/*.yaml /config/ && node dist/scripts/litellm-setup.js
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      AUTH_SERVICE_URL: http://auth-service:${PORT:-3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LITELLM_PUBLIC_URL: ${LITELLM_PUBLIC_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      # Admin interface sign-in through auth-service: set to false to turn it off.
      LITELLM_SSO_ENABLED: ${LITELLM_SSO_ENABLED:-true}
      LITELLM_STATE_FILE: /config/secrets.env
      # Creates the gateway's database next to the auth one when missing (also on
      # a postgres volume that predates it, where initdb.d does not run).
      LITELLM_DB_ADMIN_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/${POSTGRES_DB:-auth}
    volumes:
      - litellm_config:/config
    depends_on:
      auth-service:
        condition: service_healthy
    restart: "no"

  # Gives auth-service its read-only gateway inventory key and writes the
  # management key reverse-relay uses for its own deployments, then exits. The
  # inventory key is owned by a proxy_admin_viewer and restricted to the
  # inventory routes: it cannot add models, agents, MCP servers, issue keys or
  # make LLM calls. The relay key is owned by a proxy_admin but allowlisted to
  # /model/info, /model/new and /model/delete only.
  litellm-provision:
    image: ${AUTH_IMAGE:-ghcr.io/circle-rd/auth-service:nightly}
    profiles: ["llm"]
    user: root
    entrypoint: ["node", "dist/scripts/litellm-provision.js"]
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_STATE_FILE: /config/secrets.env
      LITELLM_INVENTORY_KEY_FILE: /run/litellm-provisioner/inventory-key
      # Read by the reverse-relay container, which mounts the same volume.
      LITELLM_RELAY_KEY_FILE: /run/litellm-provisioner/relay-key
    volumes:
      - litellm_config:/config:ro
      - litellm_provisioner:/run/litellm-provisioner
    depends_on:
      litellm:
        condition: service_healthy
    restart: "no"

  # External SSH gateway image. It is built from its own repository; auth-service
  # never builds it. The machine client and device client are registered by the
  # operator (see docs-site content 9.ssh-gateway-external-spec).
  ssh-gateway:
    image: ${SSH_GATEWAY_IMAGE:-ghcr.io/circle-rd/auth-gate:nightly}
    profiles: ["ssh"]
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:${PORT:-3001}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      SSH_GATEWAY_MACHINE_CLIENT_ID: ${SSH_GATEWAY_MACHINE_CLIENT_ID:-ssh-gateway}
      SSH_GATEWAY_MACHINE_CLIENT_SECRET: ${SSH_GATEWAY_MACHINE_CLIENT_SECRET:-}
      SSH_GATEWAY_DEVICE_CLIENT_ID: ${SSH_GATEWAY_DEVICE_CLIENT_ID:-ssh-gateway-device}
      SSH_GATEWAY_ENVELOPE_KEY: ${SSH_GATEWAY_ENVELOPE_KEY:-}
      SSH_LISTEN_ADDRESS: 0.0.0.0
      SSH_LISTEN_PORT: "2222"
      SSH_HOST_KEY_PATH: /data/ssh_host_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - ssh_gateway_net
    volumes:
      - ssh_gateway_data:/data
    ports:
      - "${SSH_GATEWAY_PORT:-2222}:2222"
    depends_on:
      auth-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  litellm:
    # Pinned to the 1.108 LTS line: custom_auth relies on LiteLLM internals,
    # re-run `pnpm test:litellm` before bumping the patch.
    # Keep the concrete LTS patch: the `lts` tag moves with every LTS release.
    # LiteLLM updates its Prisma schema at startup, so back up the `litellm`
    # database before the first start of a new minor (see the gateway guide).
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.108.8}
    profiles: ["llm"]
    # The keys generated by litellm-setup (LITELLM_MASTER_KEY, LITELLM_SALT_KEY, and
    # the wallet client secret) are read from the shared volume, then the image's
    # own entrypoint runs. The salt key encrypts the provider credentials stored in
    # the database: never change it once models have been added.
    entrypoint:
      - sh
      - -c
      - set -a && . /app/gateway/secrets.env && set +a && export WALLET_CLIENT_SECRET="$$LITELLM_WALLET_CLIENT_SECRET" && exec docker/prod_entrypoint.sh "$$@"
      - litellm
    command: ["--config", "/app/gateway/config.yaml", "--port", "4000"]
    environment:
      # Callbacks and custom_auth import their sibling modules by bare name; the
      # config directory must be importable before LiteLLM loads them.
      PYTHONPATH: /app/gateway
      # The admin interface sign-in through auth-service (PROXY_BASE_URL and the
      # GENERIC_* settings, AUTO_REDIRECT_UI_LOGIN_TO_SSO included) is written by
      # litellm-setup into secrets.env, next to the client id and secret: nothing to
      # set here, and it always matches the auth-service version.
      DATABASE_URL: postgresql://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@postgres:5432/litellm
      # Token validation (litellm/custom_auth.py, which refuses to start when a
      # value is empty; `:?` is avoided because compose also interpolates
      # services of inactive profiles). The JWKS is fetched over the Docker
      # network; iss/aud must match what auth-service puts in the token.
      JWT_PUBLIC_KEY_URL: http://auth-service:${PORT:-3001}/api/auth/jwks
      JWT_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3001}
      JWT_AUDIENCE: ${LITELLM_PUBLIC_URL:-}
      # Wallet hook (litellm/circle_wallet.py): checks the user's credit before a
      # call and bills the cost afterwards, through the wallet API of auth-service.
      WALLET_AUTH_URL: http://auth-service:${PORT:-3001}
      WALLET_CLIENT_ID: litellm-wallet
      # Entitlement resolution (litellm/entitlements.py) and gross usage
      # reporting (litellm/resource_usage.py) reuse the wallet machine client.
      GATEWAY_ENTITLEMENTS_URL: http://auth-service:${PORT:-3001}
      GATEWAY_ENTITLEMENTS_SCOPE: gateway:entitlements:read
      GATEWAY_ENTITLEMENTS_TTL_S: ${GATEWAY_ENTITLEMENTS_TTL_S:-30}
      RESOURCE_USAGE_SCOPE: resources:usage:write
      WALLET_SPOOL_DIR: /var/lib/circle-wallet
      # Keep usage events inside the same persistent volume, without sharing the
      # wallet's pending/dead directories.
      RESOURCE_USAGE_SPOOL_DIR: /var/lib/circle-wallet/resource-usage
      # Per-user ceilings of the wallet hook: billable calls per minute, spend
      # per minute (provider dollars) and model calls in progress at once.
      WALLET_MAX_REQUESTS_PER_MINUTE: ${WALLET_MAX_REQUESTS_PER_MINUTE:-120}
      WALLET_MAX_SPEND_PER_MINUTE_USD: ${WALLET_MAX_SPEND_PER_MINUTE_USD:-5}
      WALLET_MAX_CONCURRENT_CALLS: ${WALLET_MAX_CONCURRENT_CALLS:-8}
    volumes:
      # Chemin dédié : ne masque rien de ce que l'image LiteLLM place dans /app/litellm.
      - litellm_config:/app/gateway:ro
      # Debits that could not be delivered yet survive a restart here.
      - litellm_spool:/var/lib/circle-wallet
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      litellm-setup:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  # The external gateway resolves auth-service but not Postgres or LiteLLM.
  # Outbound target egress is not restricted by this network.
  ssh_gateway_net:

volumes:
  ssh_gateway_data:
  postgres_data:
  litellm_config:
  litellm_spool:
  litellm_provisioner:
